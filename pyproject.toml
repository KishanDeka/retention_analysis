[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-retention-analytics"
version = "0.1.0"
description = "Customer churn, Bayesian experimentation, uplift modeling and financial targeting portfolio project"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
